syntax = "proto3";

package auth.v1;

option go_package = "github.com/canda6/atlas-example/gen/proto/go/auth";

message AuthenticateRequest {
  string sdk_token = 1;
  string account_id = 2;
  string channel = 3;
}

message AuthenticateResponse {
  reserved 5;
  reserved "is_new_role";

  bool success = 1;
  string message = 2;
  string game_token = 3;
  string role_id = 4;
}
